<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Basic HTML Website</title>

        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="favicon.ico" type="image/x-icon">

        <meta name="description" content="A basic HTML website template for beginners.">

    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="articles.html">Articles</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
            <h1>Contact Me</h1>
            <p>Send me a message and I will get back to you as soon as possible.</p>

            <form action="#" method="post">
                <p>
                <label for="name">Name</label><br>
                <input type="text" id="name" name="name" required>
                </p>

                <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required>
                </p>

                <p>
                <label for="message">Message</label><br>
                <textarea id="message" name="message" rows="6" required></textarea>
                </p>

                <button type="submit">Send Message</button>
            </form>
            </section>
        </main>

        <footer>
            <p>© 2026 Christine Joy Espiritu. All rights reserved.</p>
        </footer>
    </body>
